<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReelShift Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <h1 id="title"></h1>
        <p class="notice" id="saveNotice"></p>
      </header>

      <section class="card" aria-labelledby="settingsHeading">
        <h2 id="settingsHeading">Settings</h2>

        <label class="row">
          <input type="checkbox" id="enabled" />
          <span id="labelMaster"></span>
        </label>

        <label class="row">
          <input type="checkbox" id="youtubeEnabled" />
          <span id="labelYouTube"></span>
        </label>

        <label class="row">
          <input type="checkbox" id="facebookEnabled" />
          <span id="labelFacebook"></span>
        </label>

        <label class="row column">
          <span id="labelDelay"></span>
          <div class="delay-line">
            <input type="range" id="delayMs" min="0" max="5000" step="100" />
            <span id="delayValue" aria-live="polite"></span>
          </div>
        </label>

        <label class="row">
          <input type="checkbox" id="pauseWhenInteracting" />
          <span id="labelPauseInteracting"></span>
        </label>
      </section>

      <section class="card" aria-labelledby="howItWorksTitle">
        <h2 id="howItWorksTitle"></h2>
        <p id="howItWorksBody"></p>
      </section>

      <section class="card" aria-labelledby="privacyTitle">
        <h2 id="privacyTitle"></h2>
        <p id="privacyBody"></p>
        <p id="statusLocal"></p>
      </section>
    </main>

    <script src="../shared/constants.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
